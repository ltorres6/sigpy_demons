[project]
name = "sigpy-demons"
version = "0.1.0"
description = "Demons image registration with optional GPU acceleration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sigpy>=0.1.25",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = ["cupy-cuda13x[ctk]>=13.6"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "gpu: requires CuPy and a CUDA device",
    "slow: end-to-end registration runs",
]
