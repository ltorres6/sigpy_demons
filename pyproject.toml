[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydemons"
dynamic = ["version"]
description = "Demons image registration on CPU (NumPy) or GPU (CuPy)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = ["cupy-cuda13x[ctk]>=13.6"]
plot = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[tool.hatch.version]
path = "pydemons/__init__.py"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true
markers = [
    "gpu: requires CuPy and a CUDA device",
    "slow: end-to-end registration runs",
]
